<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="calculator.css"/>
</head>
<body>
    <nav class="nav-main">
        <ul class="nav-items">
            <li class="nav-item"><a href="/">Home</a></li>
            <li class="nav-item"><a href ="/chess">Chess</a></li>
        </ul>
    </nav>
    <div class="calculator">
        <div class="screen">
        </div>
        <div class="row">
            <button class="btn-medium" id="clear">C</button>
            <button class="btn-small" id="backspace">←</button>
            <button class="btn-small" id="divide">÷</button>
        </div>
        <div class="row">
            <button class="btn-small" id="seven">7</button>
            <button class="btn-small" id="eight">8</button>
            <button class="btn-small" id="nine">9</button>
            <button class="btn-small" id="multiply">x</button>
        </div>
        <div class="row">
            <button class="btn-small" id="four">4</button>
            <button class="btn-small" id="give">5</button>
            <button class="btn-small" id="six">6</button>
            <button class="btn-small" id="minus">-</button>
        </div>
        <div class="row">
            <button class="btn-small" id="one">1</button>
            <button class="btn-small" id="two">2</button>
            <button class="btn-small" id="three">3</button>
            <button class="btn-small" id="plus">+</button>
        </div>
        <div class="row">
            <button class="btn-large" id="zero">0</button>
            <button class="btn-small" id="equals">=</button>
        </div>
    </div>
    <script src="calculator.js" defer></script>
</body>
</html>
